name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-cmatrix
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          asd_versions="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd")"
          version_count=0
          if [[ -n "$asd_versions" ]]; then
            while IFS= read -r asd_version; do
              version_count=$((version_count + 1))
              echo "asd=$asd_version tag=$tag_version"
              if [[ "$asd_version" != "$tag_version" ]]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
                exit 1
              fi
            done <<< "$asd_versions"
          fi
          if [[ "$version_count" -eq 0 ]]; then
            echo "::error::No :version entries found in $PACKAGE.asd" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
